<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="拾光 — 灯下自学，拾起时光" />
  <title>拾光 · 灯下自学课堂</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- ========== 欢迎页（网站名称页） ========== -->
  <div class="welcome" id="welcome">
    <div class="welcome-lamp" aria-hidden="true"></div>
    <div class="welcome-content">
      <div class="welcome-mark" aria-hidden="true">
        <svg width="56" height="56" viewBox="0 0 22 22" fill="none">
          <path d="M11 2v9M11 11l-5.5 5.5a4.95 4.95 0 0 0 7 0L11 11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
        </svg>
      </div>
      <h1 class="welcome-title">拾光</h1>
      <p class="welcome-subtitle">灯下自学，拾起时光</p>
      <p class="welcome-desc" id="welcomeClock">—— ——</p>
      <button class="welcome-enter" id="welcomeEnter" type="button">
        进入课堂 <span>→</span>
      </button>
    </div>
  </div>

  <!-- ========== 导航栏 ========== -->
  <header class="nav">
    <a href="#" class="brand" aria-label="拾光首页">
      <span class="brand-mark" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
          <path d="M11 2v9M11 11l-5.5 5.5a4.95 4.95 0 0 0 7 0L11 11" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="11" cy="11" r="1.5" fill="currentColor"/>
        </svg>
      </span>
      <span class="brand-name">拾光</span>
    </a>

    <div class="nav-clock" id="navClock" aria-label="当前时间">00:00:00</div>

    <div class="search" role="search">
      <svg class="search-icon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.5"/>
        <path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <input id="searchInput" type="search" placeholder="搜索课程或讲师" aria-label="搜索课程" autocomplete="off" />
    </div>

    <div class="nav-progress" title="整体学习进度">
      <div class="nav-ring" id="navRing" style="--p:0">
        <span class="nav-ring-label" id="navRingLabel">0%</span>
      </div>
    </div>
  </header>

  <!-- ========== 英雄区：台灯下的继续学习 ========== -->
  <section class="hero" id="hero" aria-label="继续学习">
    <div class="hero-lamp" aria-hidden="true"></div>
    <div class="hero-content" id="heroContent">
      <!-- 由 JS 注入 -->
    </div>
  </section>

  <!-- ========== 学习统计条 ========== -->
  <section class="stats-bar" aria-label="学习数据">
    <div class="stat">
      <span class="stat-num" id="statTotal">0</span>
      <span class="stat-name">课程总数</span>
    </div>
    <div class="stat-divider" aria-hidden="true"></div>
    <div class="stat">
      <span class="stat-num" id="statDone">0</span>
      <span class="stat-name">已完成</span>
    </div>
    <div class="stat-divider" aria-hidden="true"></div>
    <div class="stat">
      <span class="stat-num" id="statActive">0</span>
      <span class="stat-name">进行中</span>
    </div>
    <div class="stat-divider" aria-hidden="true"></div>
    <div class="stat">
      <span class="stat-num" id="statHours">0<span class="stat-unit">h</span></span>
      <span class="stat-name">累计学时</span>
    </div>
  </section>

  <!-- ========== 课程目录 ========== -->
  <section class="catalog" aria-label="课程目录">
    <div class="catalog-head">
      <h2 class="catalog-title">全部课程</h2>
      <div class="filters" role="tablist" aria-label="课程分类">
        <button class="filter active" data-cat="all" role="tab" aria-selected="true" type="button">全部</button>
        <button class="filter" data-cat="前端" role="tab" type="button">前端</button>
        <button class="filter" data-cat="后端" role="tab" type="button">后端</button>
        <button class="filter" data-cat="基础" role="tab" type="button">基础</button>
        <button class="filter" data-cat="算法" role="tab" type="button">算法</button>
      </div>
    </div>

    <div class="course-grid" id="courseGrid">
      <!-- 由 JS 注入 -->
    </div>

    <div class="empty-state" id="emptyState" hidden>
      <span class="empty-icon" aria-hidden="true">∅</span>
      <p class="empty-title">没有找到匹配的课程</p>
      <p class="empty-hint">试试别的关键词，或切换分类筛选</p>
    </div>
  </section>

  <footer class="footer">
    <span>拾光 · 灯下自学课堂</span>
    <span class="footer-note">数据保存在本地浏览器</span>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
